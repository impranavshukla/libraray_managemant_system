<div class="view-book-container">
  <h2>All Books 📚</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Book Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Quantity</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- use @for with signal -->
      @for(book of books(); track book.id){
        <tr>
          <td>{{ book.id }}</td>
          <td>{{ book.title }}</td>
          <td>{{ book.author }}</td>
          <td>{{ book.category }}</td>
          <td>{{ book.quantity }}</td>
          <td>
            <button class="edit-btn" (click)="editBook(book.id)">Edit</button>
            <button class="delete-btn" (click)="deleteBook(book.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
