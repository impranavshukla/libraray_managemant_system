<div class="mybooks-container">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h2>My Books</h2>
    <p>Manage your borrowed books here</p>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="summary-section">

    <div class="summary-card">
      <h3>Total Borrowed</h3>
      <p>5</p>
    </div>

    <div class="summary-card">
      <h3>Currently Issued</h3>
      <p>2</p>
    </div>

  </div>

  <!-- BOOK TABLE -->
  <div class="table-container">

    <table>
      <thead>
        <tr>
          <th>Book Title</th>
          <th>Author</th>
          <th>Issue Date</th>
          <th>Return Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        @for(record of myBooks();track record.id){
            <tr>
          <td>{{ record.book.title }}</td>
          <td>{{ record.book.author }}</td>
          <td>{{ record.issueDate }}</td>
          <td>{{ record.returnDate }}</td>
          <td><span class="status {{ record.status }}">{{ record.status }}</span></td>
          <td><button class="return-btn">Return</button></td>
        </tr>
        }


      </tbody>
    </table>

  </div>

</div>
