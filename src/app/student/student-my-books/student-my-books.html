<div class="mybooks-container">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h2>My Books</h2>
    <p>Manage your borrowed books here</p>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="summary-section">

    <div class="summary-card">
      <h3>Total Borrowed</h3>
      <p>5</p>
    </div>

    <div class="summary-card">
      <h3>Currently Issued</h3>
      <p>2</p>
    </div>

  </div>

  <!-- BOOK TABLE -->
  <div class="table-container">

    <table>
      <thead>
        <tr>
          <th>Book Title</th>
          <th>Author</th>
          <th>Issue Date</th>
          <th>Return Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td>The Silent Patient</td>
          <td>Alex Michaelides</td>
          <td>20 Feb 2026</td>
          <td>05 Mar 2026</td>
          <td><span class="status issued">Issued</span></td>
          <td><button class="return-btn">Return</button></td>
        </tr>

        <tr>
          <td>Atomic Habits</td>
          <td>James Clear</td>
          <td>10 Jan 2026</td>
          <td>25 Jan 2026</td>
          <td><span class="status returned">Returned</span></td>
          <td><button class="disabled-btn">Completed</button></td>
        </tr>

      </tbody>
    </table>

  </div>

</div>
