<div class="browse-container">

  <!-- PAGE HEADER -->
  <div class="browse-header">
    <h2>Browse Books</h2>
    <p>Explore available books in the library</p>
  </div>

  <!-- SEARCH + FILTER -->
  <div class="filter-section">

    <div class="search-box">
      <input type="text" placeholder="Search by title or author..." />
    </div>

    <div class="filter-box">
      <select>
        <option value="">All Genres</option>
        <option>Fiction</option>
        <option>Self-Help</option>
        <option>Science</option>
        <option>Technology</option>
        <option>Mystery</option>
      </select>
    </div>

  </div>

  <!-- BOOK GRID -->
  <div class="book-grid">

    <div class="book-card">
      <div class="book-cover"></div>
      <h3>The Silent Patient</h3>
      <p class="author">Alex Michaelides</p>
      <span class="genre">Mystery</span>
      <span class="status available">Available</span>
      <button class="view-btn">View Details</button>
    </div>

    <div class="book-card">
      <div class="book-cover"></div>
      <h3>Atomic Habits</h3>
      <p class="author">James Clear</p>
      <span class="genre">Self-Help</span>
      <span class="status available">Available</span>
      <button class="view-btn">View Details</button>
    </div>

    <div class="book-card">
      <div class="book-cover"></div>
      <h3>Deep Work</h3>
      <p class="author">Cal Newport</p>
      <span class="genre">Productivity</span>
      <span class="status issued">Issued</span>
      <button class="view-btn disabled">Not Available</button>
    </div>

    <div class="book-card">
      <div class="book-cover"></div>
      <h3>The Alchemist</h3>
      <p class="author">Paulo Coelho</p>
      <span class="genre">Fiction</span>
      <span class="status available">Available</span>
      <button class="view-btn">View Details</button>
    </div>

  </div>

</div>
