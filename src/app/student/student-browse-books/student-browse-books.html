<div class="browse-container">

  <!-- PAGE HEADER -->
  <div class="browse-header">
    <h2>Browse Books</h2>
    <p>Explore available books in the library</p>
  </div>

  <!-- SEARCH + FILTER -->
  <div class="filter-section">

    <div class="search-box">
      <input type="text" placeholder="Search by title or author..." />
    </div>

    <div class="filter-box">
      <select>
        <option value="">All Genres</option>
        <option>Fiction</option>
        <option>Self-Help</option>
        <option>Science</option>
        <option>Technology</option>
        <option>Mystery</option>
      </select>
    </div>

  </div>

  <!-- BOOK GRID -->
  <div class="book-grid">

    @for(book of bookList(); track book.id){
    <div class="book-card" >
  
  <img [src]="book.thumbnail" class="book-cover" alt="{{book.title}}">

  <h3>{{book.title}}</h3>
  <p class="author">{{book.author}}</p>
  <span class="genre">{{book.genre}}</span>

  <span 
    class="status" 
    [ngClass]="book.availableCopies > 0 ? 'available' : 'issued'">
    {{ book.availableCopies > 0 ? 'Available' : 'Issued' }}
  </span>

  <button 
    class="view-btn"
    [disabled]="book.availableCopies === 0">
    {{ book.availableCopies > 0 ? 'View Details' : 'Not Available' }}
  </button>

</div>
    }


  </div>

</div>
